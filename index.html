<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Profesionales - Prototipo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <h1>Encuentra tu profesional de confianza</h1>
    <p class="subtitle">Leña, gasfitería, electricidad y más — cerca de ti</p>
  </header>

  <main class="container">

    <section class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar por nombre, oficio o zona...">
      <button type="button" id="searchBtn">Buscar</button>
    </section>

    <section class="filters" id="filters">
      <button class="filter-chip active" data-oficio="todos">Todos</button>
      <button class="filter-chip" data-oficio="lena">Leña</button>
      <button class="filter-chip" data-oficio="gasfiteria">Gasfitería</button>
      <button class="filter-chip" data-oficio="electricidad">Electricidad</button>
    </section>

    <section class="actions">
      <button type="button" class="btn-primary" id="addProfileBtn">+ Agregar perfil</button>
    </section>

    <section class="profile-list" id="profileList"></section>

    <p class="empty-state" id="emptyState" hidden>No se encontraron perfiles con esos criterios.</p>

  </main>

  <footer class="footer">
    <p>Prototipo de laboratorio — datos de ejemplo, sin conexión a backend.</p>
  </footer>

  <div class="modal-overlay" id="formModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
      <div class="modal-header">
        <h2 id="formModalTitle">Agregar perfil</h2>
        <button type="button" class="modal-close" id="formModalClose" aria-label="Cerrar">✕</button>
      </div>
      <form id="profileForm" novalidate>
        <div class="form-field">
          <label for="fieldNombre">Nombre</label>
          <input type="text" id="fieldNombre" name="nombre" required>
        </div>
        <div class="form-field">
          <label for="fieldEdad">Edad</label>
          <input type="number" id="fieldEdad" name="edad" min="18" max="99" required>
        </div>
        <div class="form-field">
          <label for="fieldOficio">Oficio</label>
          <select id="fieldOficio" name="oficio" required>
            <option value="lena">Leña</option>
            <option value="gasfiteria">Gasfitería</option>
            <option value="electricidad">Electricidad</option>
          </select>
        </div>
        <div class="form-field">
          <label for="fieldExperiencia">Años de experiencia</label>
          <input type="number" id="fieldExperiencia" name="experiencia" min="0" max="80" required>
        </div>
        <div class="form-field">
          <label for="fieldZona">Zona</label>
          <input type="text" id="fieldZona" name="zona" required>
        </div>
        <div class="form-field">
          <label for="fieldCertificacion">Estado de certificación</label>
          <select id="fieldCertificacion" name="certificacion" required>
            <option value="verificado">Verificado</option>
            <option value="tramite">En trámite</option>
            <option value="sin_certificacion">Sin certificación</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="cancelFormBtn">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar perfil</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="detailModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
      <div class="modal-header">
        <h2 id="detailModalTitle">Detalle del perfil</h2>
        <button type="button" class="modal-close" id="detailModalClose" aria-label="Cerrar">✕</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
